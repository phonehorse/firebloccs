<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DWTD - Firebloccs Edition</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        #game-container { width: 100vw; height: 100vh; position: relative; }
        .controls-hint {
            position: absolute; top: 10px; left: 10px;
            color: #fff; font-family: sans-serif; font-size: 12px;
            background: rgba(0,0,0,0.5); padding: 5px; border-radius: 5px;
            pointer-events: none; z-index: 10;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div class="controls-hint">DWTD v1.0 [FORCE RENDER MODE]</div>
        <div id="ruffle-player"></div>
    </div>

    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    <script>
        window.addEventListener("DOMContentLoaded", async () => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById("ruffle-player");
            
            player.style.width = "100%";
            player.style.height = "100%";
            container.appendChild(player);

            try {
                await player.load({
                    url: "dwtd.swf",
                    backgroundColor: "#000000",
                    autoplay: "on",
                    unmuteOverlay: true,
                    forceStop: false // Try to prevent the game from stopping itself
                });
                console.log("DWTD loaded");
            } catch (e) {
                console.error("Load error:", e);
            }
        });
    </script>
</body>
</html>
