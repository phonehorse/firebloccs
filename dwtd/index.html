<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DWTD - Firebloccs Edition</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        #game-container { width: 100%; height: 100%; position: relative; }
        iframe { width: 100%; height: 100%; border: none; }
        
        #server-warning {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #ff4444; color: white; z-index: 1000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 20px; box-sizing: border-box;
        }
        .warning-box {
            background: white; color: black; padding: 20px; border-radius: 15px;
            max-width: 80%; box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        h2 { margin-top: 0; color: #cc0000; }
        p { font-size: 14px; line-height: 1.5; }
        .btn-fix { 
            display: inline-block; margin-top: 20px; padding: 10px 20px; 
            background: #cc0000; color: white; text-decoration: none; 
            border-radius: 5px; font-weight: bold; 
        }
    </style>
</head>
<body>
    <div id="server-warning">
        <div class="warning-box">
            <h2>❌ SERVER REQUIRED</h2>
            <p><strong>DWTD cannot run as a local file!</strong></p>
            <p>Browsers block Flash files on the "file://" protocol for security. You MUST upload the <b>firebloccs_dwtd_final.zip</b> to a website (like Netlify or GitHub Pages) to play this game.</p>
            <a href="https://app.netlify.com/drop" target="_blank" class="btn-fix">Upload to Netlify (Free)</a>
        </div>
    </div>
    <div id="game-container">
        <div id="ruffle-container"></div>
    </div>

    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    <script>
        window.addEventListener("DOMContentLoaded", () => {
            // Check if we are running on file://
            if (window.location.protocol === 'file:') {
                document.getElementById('server-warning').style.display = 'flex';
                return;
            }
            
            document.getElementById('server-warning').style.display = 'none';
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById("ruffle-container");
            container.appendChild(player);
            player.load("dwtd.swf");
        });
    </script>
</body>
</html>
