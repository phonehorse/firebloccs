<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Firebloccs Store</title>
    <style>
        /* --- STYLES --- */
        body {
            background-color: #121212;
            color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: #1f1f1f;
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #333;
        }
        .logo {
            width: 64px;
            height: 64px;
            border-radius: 12px;
            margin-bottom: 10px;
        }
        header h1 {
            margin: 0;
            font-size: 24px;
            letter-spacing: 1px;
        }
        main {
            flex: 1;
            padding: 15px;
        }
        .app-item {
            background-color: #1f1f1f;
            margin-bottom: 15px;
            padding: 15px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .app-info {
            display: flex;
            align-items: center;
        }
        .app-icon {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            margin-right: 15px;
            background-color: #333;
        }
        .app-details h3 {
            margin: 0;
            font-size: 18px;
        }
        .app-details p {
            margin: 5px 0 0;
            font-size: 12px;
            color: #aaa;
        }
        .install-btn {
            cursor: pointer;
            width: 100px;
            height: auto;
            transition: transform 0.1s;
        }
        .install-btn:active {
            transform: scale(0.95);
        }
        footer {
            padding: 20px;
            text-align: center;
            border-top: 2px solid #333;
            background-color: #1f1f1f;
        }
        .footer-img {
            max-width: 100%;
            height: auto;
        }
        .hidden { display: none !important; }
        #dev-console {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: #000; color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            border-top: 3px solid #0f0; z-index: 9999;
            max-height: 30%; display: flex; flex-direction: column;
        }
        .dev-header { background: #0f0; color: #000; font-weight: bold; padding: 5px 10px; font-size: 12px; }
        .dev-logs { padding: 10px; font-size: 11px; overflow-y: auto; flex: 1; white-space: pre-wrap; }
        .dev-controls { padding: 10px; border-top: 1px solid #0f0; display: flex; gap: 10px; }
        .dev-controls button { background: #000; color: #0f0; border: 1px solid #0f0; padding: 5px 10px; cursor: pointer; }
    </style>
</head>
<body>
